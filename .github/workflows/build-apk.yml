name: Build Privacy Screen APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 소스 파일 전체 생성
        run: |
          mkdir -p app/src/main/java/com/aireader/privacyscreen
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          printf '%s' "" | base64 -d > app/src/main/AndroidManifest.xml
          printf '%s' ""     | base64 -d > app/src/main/java/com/aireader/privacyscreen/MainActivity.kt
          printf '%s' ""  | base64 -d > app/src/main/java/com/aireader/privacyscreen/PrivacyFilterService.kt
          printf '%s' ""     | base64 -d > app/src/main/java/com/aireader/privacyscreen/PrivacyFilterView.kt
          printf '%s' ""   | base64 -d > app/src/main/res/layout/activity_main.xml
          printf '%s' "PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHJlc291cmNlcz4KICAgIDxzdHJpbmcgbmFtZT0iYXBwX25hbWUiPuyCrOyDne2ZnCDrs7TtmLgg7ZWE7YSwPC9zdHJpbmc+CjwvcmVzb3VyY2VzPgo="  | base64 -d > app/src/main/res/values/strings.xml
          printf '%s' ""   | base64 -d > app/src/main/res/values/themes.xml
          printf '%s' "" | base64 -d > app/build.gradle
          printf '%s' "cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguMy4wJyBhcHBseSBmYWxzZQogICAgaWQgJ29yZy5qZXRicmFpbnMua290bGluLmFuZHJvaWQnIHZlcnNpb24gJzEuOS4yNCcgYXBwbHkgZmFsc2UKfQo=" | base64 -d > build.gradle
          printf '%s' "" | base64 -d > settings.gradle
          printf '%s' "b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmtvdGxpbi5jb2RlLnN0eWxlPW9mZmljaWFsCmFuZHJvaWQubm9uVHJhbnNpdGl2ZVJDbGFzcz10cnVlCg=="    | base64 -d > gradle.properties

          # Android SDK 경로 설정 (없으면 빌드 실패)
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "파일 생성 완료"
          find . -name "*.kt" -o -name "*.xml" -o -name "*.gradle" | sort

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 설치 및 빌드
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: APK 빌드
        run: gradle assembleDebug --stacktrace

      - name: APK 업로드 (다운로드)
        uses: actions/upload-artifact@v4
        with:
          name: privacy-screen-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Gradle 설치 및 빌드
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: APK 빌드
        run: gradle assembleDebug --stacktrace

      - name: APK 업로드 (다운로드)
        uses: actions/upload-artifact@v4
        with:
          name: privacy-screen-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

